<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft: AI Comic Story Creation</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: var(--text);
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none;
        }

        .panels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }

        .panel-card {
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 14px;
        }

        .panel-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #475569;
        }

        .sfx-badge {
            display: inline-block;
            background: #ef4444;
            color: white;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .dialogue-box {
            background: #1e293b;
            border-left: 4px solid var(--accent);
            padding: 8px 12px;
            border-radius: 4px;
            font-style: italic;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📚 ComicCraft: AI Comic Story Creation</h1>
        <p class="subtitle">AI-Powered Comic Story & Sequential Graphic Storyboard Generator</p>
    </header>

    <div class="card">
        <div class="grid">
            <div>
                <label>Story Genre</label>
                <select id="genre">
                    <option>Superhero</option>
                    <option>Sci-Fi</option>
                    <option>Action & Adventure</option>
                    <option>Fantasy</option>
                    <option>Mystery</option>
                    <option>Anime</option>
                </select>
            </div>
            <div>
                <label>Visual Style</label>
                <select id="artStyle">
                    <option value="Classic American Comic Book">Comic Book Style (Classic)</option>
                    <option value="Japanese Manga Anime Art">Manga / Anime</option>
                    <option value="Vintage 90s Graphic Novel">Vintage 90s Comic</option>
                    <option value="Cyberpunk Comic Illustration">Cyberpunk Vibrant Comic</option>
                </select>
            </div>
        </div>

        <label>Enter your story concept or premise:</label>
        <textarea id="storyIdea" placeholder="E.g., a girl found speaking cat in the road"></textarea>

        <button onclick="createStory()">🚀 Create Full Comic Story</button>
    </div>

    <div id="results" class="hidden">
        <div class="card">
            <h2 id="story-title" style="color: var(--primary); margin-top:0;">Story Title</h2>
            <p id="story-logline" style="color: var(--accent); font-weight: 500;"></p>
            
            <h3>📜 Story Narrative</h3>
            <p id="story-body" style="line-height: 1.6; color: #cbd5e1;"></p>

            <h3>👥 Character Profiles</h3>
            <div id="character-list" style="color: var(--text-muted);"></div>
        </div>

        <div class="card">
            <h2>🖼️ Illustrated Comic Story Panels</h2>
            <div id="comic-panels" class="panels-grid"></div>
        </div>
    </div>
</div>

<script>
function createStory() {
    const premise = document.getElementById('storyIdea').value.trim();
    const genre = document.getElementById('genre').value;
    const style = document.getElementById('artStyle').value;

    if (!premise) {
        alert("Please enter a story concept!");
        return;
    }

    const title = "The Chronicles of " + premise.slice(0, 25).toUpperCase();
    const logline = `A thrilling ${genre.toLowerCase()} saga sparked when ${premise}.`;
    const fullStory = `Under the atmospheric visual style of ${style}, an extraordinary event broke the quiet monotony of ordinary life. It all began on that unexpected moment: ${premise}. What seemed like an impossible coincidence swiftly unfolded into an epic test of courage, dragging our heroes through enigmatic mysteries and dangerous stakes.`;

    document.getElementById('story-title').innerText = "📖 " + title;
    document.getElementById('story-logline').innerText = logline;
    document.getElementById('story-body').innerText = fullStory;

    document.getElementById('character-list').innerHTML = `
        <p>• <b>Protagonist:</b> The brave lead navigating the shock and adventure of '${premise.slice(0, 25)}'.</p>
        <p>• <b>Key Companion:</b> The strange, witty speaking catalyst who holds the mystery to save their world.</p>
    `;

    const panelsData = [
        {
            num: 1,
            scene: `shocked discovery, ${premise}, close up face expression, street road setting`,
            dialogue: "Did you just... speak out loud to me?!",
            sfx: "GASP!"
        },
        {
            num: 2,
            scene: `glowing magical aura, talking creature speaking with confidence, ${premise}`,
            dialogue: "Keep your voice down! They are already searching for us!",
            sfx: "HUMMMM..."
        },
        {
            num: 3,
            scene: `danger approaches from dark shadows, menacing robotic figures, intense angle`,
            dialogue: "Look behind you! We have to move now!",
            sfx: "CLASH-RUMBLE!"
        },
        {
            num: 4,
            scene: `dramatic escape, running across rooftops, dynamic action leap, vibrant comic burst`,
            dialogue: "Hold on tight, this jump is going to be wild!",
            sfx: "WHOOSH!!"
        }
    ];

    const panelsContainer = document.getElementById('comic-panels');
    panelsContainer.innerHTML = '';
    const seed = Math.floor(Math.random() * 10000);

    panelsData.forEach(p => {
        const fullPrompt = encodeURIComponent(`${p.scene}, ${style}, comic book panel illustration, bold ink lines, vibrant color, masterpiece`);
        const imgUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=512&height=512&seed=${seed + p.num}&nologo=true`;

        panelsContainer.innerHTML += `
            <div class="panel-card">
                <img src="${imgUrl}" alt="Panel ${p.num}" loading="lazy">
                <span class="sfx-badge">💥 SFX: ${p.sfx}</span>
                <h4 style="margin: 8px 0;">Panel ${p.num}</h4>
                <div class="dialogue-box">🗣️ "${p.dialogue}"</div>
            </div>
        `;
    });

    document.getElementById('results').classList.remove('hidden');
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
